name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: OPA policies
        run: |
          curl -sSL -o /tmp/opa https://openpolicyagent.org/downloads/v1.21.1/opa_linux_amd64_static
          chmod +x /tmp/opa
          /tmp/opa test packages/policy-opa/policies/
          /tmp/opa build -t wasm -e sentinel/findings -o /tmp/b.tar.gz packages/policy-opa/policies/sentinel.rego
      # Build first: cross-package imports resolve via dist/, which only
      # exists after a topological build. Typecheck/test on a clean
      # checkout fail without it (TS2307).
      - run: pnpm -r build
      - name: OPA bundle provenance
        # The committed WASM must behave identically to a fresh build from
        # the committed Rego (wasm bytes embed build metadata, so compare
        # behavior + manifest entrypoint, not bytes).
        run: |
          tar -xzf /tmp/b.tar.gz -O /policy.wasm > /tmp/fresh.wasm
          python3 -c "
          import json, tarfile
          t = tarfile.open('/tmp/b.tar.gz')
          m = json.load(t.extractfile('/.manifest'))
          assert m['wasm'][0]['entrypoint'] == 'sentinel/findings', m
          print('manifest entrypoint OK')
"
          OPA_BUNDLE_PATH=/tmp/fresh.wasm pnpm --filter @sentinel/policy-opa test
      - run: pnpm -r typecheck
      - run: pnpm -r test
