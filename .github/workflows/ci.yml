name: ci
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Build first: cross-package imports resolve via dist/, which only
      # exists after a topological build. Typecheck/test on a clean
      # checkout fail without it (TS2307).
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
